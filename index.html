 function carveHouse(lot){
  const HOUSE_WC=rnd()<.5?'#f2f2f4':'#2b2b31';lot.wc=HOUSE_WC;

  for(let i=1;i<hRooms.length;i++){let best=0,bd=1e9;for(let j=0;j<i;j++){const d=Math.abs(hRooms[i].cx-hRooms[j].cx)+Math.abs(hRooms[i].cy-hRooms[j].cy);if(d<bd){bd=d;best=j;}}corr(hRooms[i],hRooms[best]);}

 const mx=Number.isFinite(t.maxhp)&&t.maxhp>0?t.maxhp:NPC_HP;
 return Math.hypot(t.x-player.x,t.y-player.y)<70&&(Number.isFinite(t.hp)&&t.hp>0&&t.hp<mx*.35||t.stun>0);}

function startExec(t){const now=performance.now();FX.exec={t,cls:fxCls(player.w),t0:now,hit:false,shots:0,last:now};FX.nextExec=now+1100;
 FX.hsUntil=0;FX.slowUntil=now+100;FX.slowK=.78;FX.zmT=1.035;
 t.stun=Math.max(t.stun||0,.5);player.charge=0;player.burstN=0;player.a=Math.atan2(t.y-player.y,t.x-player.x);fxPop('EXECUTION','#ff8794',16,.6);vib(15);}

function fxExecBlow(X){const t=X.t;if(!t.alive)return;const a=Math.atan2(t.y-player.y,t.x-player.x),c=Math.cos(a),s=Math.sin(a);let kp=600;
 if(X.cls==='melee'){parts.push({x:player.x+c*20,y:player.y+s*20,swing:1,a,t:.2,c:'#fff'});parts.push({x:player.x+c*22,y:player.y+s*22,slash:1,a,t:.22});kp=950;shake=Math.min(20,shake+12);}
 else if(X.cls==='pistol'){flashes.push({x:t.x-c*10,y:t.y-s*10,a,t:.09});kp=520;spurt(t.x,t.y,a,34);shake=Math.min(20,shake+9);}
 else if(X.cls==='shotgun'){flashes.push({x:t.x-c*12,y:t.y-s*12,a,t:.12});fxRing(t.x,t.y,42,'255,230,170',.18);kp=1500;t._gib=1;shake=Math.min(22,shake+15);}
 else if(X.cls==='multi'){flashes.push({x:player.x+c*16,y:player.y+s*16,a,t:.06});kp=750;shake=Math.min(20,shake+8);}
 else{fxRing(t.x,t.y,70,'255,255,255',.3);fxDust(t.x,t.y,8);kp=300;shake=Math.min(20,shake+12);}
 for(let i=0;i<16;i++)addBlood(t.x+(FX_R()-.5)*44+c*i*4,t.y+(FX_R()-.5)*44+s*i*4,3+FX_R()*8);
 spurt(t.x,t.y,a,26);fxSpark(t.x,t.y,a,10,1.8);
 if(X.cls==='melee'||X.cls==='stomp')fxGibs(t.x,t.y,a,6);
 const kp0=killPow;killPow=kp;hurt(t,Math.max(999,(t.hp||0)+1),a,true);killPow=kp0;
 G.score+=500;floorScore+=500;player.hp=Math.min(player.maxhp,player.hp+15);fxPop('EXECUTION · +500 · +15 HP','#7dff9a',14,.9);for(let i=0;i<6;i++)fxPlus(player.x,player.y);
 FX.zmT=1.045;FX.vig=0;G.execs=(G.execs||0)+1;vib(28);}
function fxExecStep(){const X=FX.exec,now=performance.now(),el=now-X.t0,t=X.t,step=Math.min(.033,Math.max(0,(now-X.last)/1000));X.last=now;
 if(t.alive){player.a=Math.atan2(t.y-player.y,t.x-player.x);t.stun=Math.max(t.stun||0,.5);const d=Math.hypot(t.x-player.x,t.y-player.y);if(!X.hit&&d>24)move(player,(t.x-player.x)/d*Math.min(d-24,step*220),(t.y-player.y)/d*Math.min(d-24,step*220));}
 if(X.cls==='multi'&&!X.hit&&t.alive&&X.shots<3&&el>20+X.shots*25){X.shots++;flashes.push({x:player.x+Math.cos(player.a)*16,y:player.y+Math.sin(player.a)*16,a:player.a,t:.05});spurt(t.x,t.y,player.a,6);fxSpark(t.x,t.y,player.a,4);t.flash=.1;shake=Math.min(16,shake+3);fxCasing(player.x,player.y,player.a);}
 if(!X.hit&&el>90){X.hit=true;fxExecBlow(X);}
 if(el>220||!player.alive){FX.exec=null;FX.invT=now+80;}}
// ---- regen: still or in cover, 1.2s after the last hit ----
function fxHeal(dt){FX.coverT-=dt;if(FX.coverT<=0){FX.coverT=.15;const r=(player.r||11)+9;let adj=false;for(let i=0;i<8;i++){const a=i*Math.PI/4;if(solidAt(player.x+Math.cos(a)*r,player.y+Math.sin(a)*r)){adj=true;break;}}
  let exp=false;if(adj){for(const e of enemies){if(!e.alive||e.disg||e.stun>0)continue;if(Math.abs(e.x-player.x)+Math.abs(e.y-player.y)>1100)continue;if(los(e.x,e.y,player.x,player.y)){exp=true;break;}}}FX.cover=adj&&!exp;}
 const still=!player.mv&&!TCH.move;FX.heal='';
 if(FX.gt-FX.lastHit>1.2&&(still||FX.cover)&&player.hp<player.maxhp){const rate=FX.cover?15:8;player.hp=Math.min(player.maxhp,player.hp+rate*dt);FX.heal=FX.cover?'COVER +15/s':'HEALING +8/s';if(FX_R()<dt*(FX.cover?10:6))fxPlus(player.x,player.y);}}
function fxUpdate(dt){if(G.state!=='play'&&G.state!=='dead')return;FX.gt+=dt;const f=Math.exp(-dt*7);
 for(const o of FX.sp){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=f;o.vy*=f;o.t-=dt;}
 for(const o of FX.du){o.x+=o.vx*dt;o.y+=o.vy*dt;o.r+=dt*16;o.t-=dt;}
 for(const o of FX.ri)o.t-=dt;
 for(const o of FX.nu){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy*=Math.exp(-dt*4);o.t-=dt;}
 for(const o of FX.pl){o.y+=o.vy*dt;o.t-=dt;}
 fxCompact(FX.sp);fxCompact(FX.du);fxCompact(FX.ri);fxCompact(FX.nu);fxCompact(FX.pl);
 const g=Math.exp(-dt*6);
 for(const o of FX.cas)if(o.t>0){const nx=o.x+o.vx*dt,ny=o.y+o.vy*dt;if(solidAt(nx,ny)){o.vx*=-.3;o.vy*=-.3;}else{o.x=nx;o.y=ny;}o.vx*=g;o.vy*=g;o.a+=o.va*dt;o.va*=g;o.t-=dt;}
 for(const o of FX.gib)if(o.t>0){const nx=o.x+o.vx*dt,ny=o.y+o.vy*dt;if(solidAt(nx,ny)){o.vx*=-.25;o.vy*=-.25;}else{o.x=nx;o.y=ny;}o.vx*=g;o.vy*=g;o.t-=dt;if(o.t<=0)addBlood(o.x,o.y,2+o.r);}
 if(G.state==='play'&&player&&player.alive){fxHeal(dt);}else FX.exec=null;}
{const _u=update;update=function(dt){const now=performance.now();const active=G.state==='play';
 const raw=Number.isFinite(dt)?Math.max(0,Math.min(.1,dt)):0;
 if(active&&FX.exec)fxExecStep();
 const scale=active&&now<FX.slowUntil?FX.slowK:1;FX.slowFrame=scale;
 let r;if(!(active&&now<FX.hsUntil))r=_u.call(this,raw*scale);
 // Real elapsed active time, never slow-time squared; FX and regen keep progressing through short hitstops.
 try{fxUpdate(raw);}catch(e){console.error(e);}return r;};}
{const _ll=loadLevel;loadLevel=function(){const r=_ll.apply(this,arguments);FX.cas.length=0;FX.gib.length=0;FX.casI=FX.gibI=0;FX.sp.length=FX.du.length=FX.ri.length=FX.nu.length=FX.pl.length=0;FX.exec=null;FX.streak=0;FX.lastHit=FX.gt;FX.cover=false;FX.coverT=0;FX.invT=0;FX.hsUntil=0;FX.slowUntil=0;FX.nextExec=0;FX.nextStop=0;FX.po.length=0;FX.marks.length=0;TCH.move=null;OT.justRel=false;return r;};}
// ---- drawing: floor layer (casings, gibs) ----
function fxView(x,y,m){return Math.abs(x-cam.x)<W/2/ZOOM+m&&Math.abs(y-cam.y)<H/2/ZOOM+m;}
function fxDecals(){if(FX.cas.length){ctx.strokeStyle='#d6a23c';ctx.lineWidth=2;ctx.beginPath();for(const o of FX.cas){if(!fxView(o.x,o.y,10))continue;const dx=Math.cos(o.a)*2.6,dy=Math.sin(o.a)*2.6;ctx.moveTo(o.x-dx,o.y-dy);ctx.lineTo(o.x+dx,o.y+dy);}ctx.stroke();}
 if(FX.gib.length){ctx.fillStyle='#5e0710';ctx.beginPath();for(const o of FX.gib){if(!fxView(o.x,o.y,10))continue;ctx.moveTo(o.x+o.r,o.y);ctx.arc(o.x,o.y,o.r,0,6.283);}ctx.fill();ctx.fillStyle='#b3192a';ctx.beginPath();for(const o of FX.gib){if(!fxView(o.x,o.y,10))continue;ctx.moveTo(o.x+o.r*.5-1,o.y-1);ctx.arc(o.x-1,o.y-1,o.r*.5,0,6.283);}ctx.fill();}}
{const _dd=drawDecals;drawDecals=function(){const r=_dd.apply(this,arguments);try{fxDecals();}catch(e){}return r;};}
// ---- drawing: top world layer (tracers, light, sparks, dust, rings, numbers, heal) ----
function fxTop(){ctx.save();const go=ctx.globalCompositeOperation;ctx.globalCompositeOperation='lighter';
 ctx.strokeStyle='rgba(255,226,140,.9)';ctx.lineWidth=1.3;ctx.beginPath();for(const b of bullets){if(!b.p||b.dead||b.flame||b.rocket)continue;if(!fxView(b.x,b.y,40))continue;ctx.moveTo(b.x-b.vx*(b.rail?.024:.012),b.y-b.vy*(b.rail?.024:.012));ctx.lineTo(b.x,b.y);}ctx.stroke();
 for(const f of flashes){if(f.ring||!fxView(f.x,f.y,140))continue;if(f.big){ctx.globalAlpha=Math.min(1,f.t/.18)*.35;ctx.drawImage(FX_GLOW,f.x-60,f.y-60,120,120);}else{ctx.globalAlpha=Math.min(1,f.t/.05)*.55;ctx.drawImage(FX_GLOW,f.x-(f.pulseR||22),f.y-(f.pulseR||22),(f.pulseR||22)*2,(f.pulseR||22)*2);}}
 ctx.globalAlpha=1;ctx.strokeStyle='#ffd27a';ctx.lineWidth=1.6;ctx.beginPath();for(const o of FX.sp){ctx.moveTo(o.x-o.vx*.02,o.y-o.vy*.02);ctx.lineTo(o.x,o.y);}ctx.stroke();
 ctx.globalCompositeOperation=go;
 for(const o of FX.du){ctx.globalAlpha=Math.max(0,o.t/o.m)*.45;ctx.fillStyle='#b9ae9c';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.283);ctx.fill();}
 for(const o of FX.ri){const q=1-o.t/o.m;ctx.globalAlpha=1-q;ctx.strokeStyle='rgba('+o.c+',1)';ctx.lineWidth=2+6*(1-q);ctx.beginPath();ctx.arc(o.x,o.y,8+q*o.R,0,6.283);ctx.stroke();}
 if(player&&player.alive&&(FX.heal||FX.cover)){const p=.5+.5*Math.sin(performance.now()/180);ctx.globalAlpha=FX.heal?.35+.3*p:.25;ctx.strokeStyle='#5dff8a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,(player.r||11)+5+p*3,0,6.283);ctx.stroke();
  ctx.globalAlpha=1;}
 ctx.font='bold 14px monospace';ctx.textAlign='center';for(const o of FX.pl){ctx.globalAlpha=Math.max(0,o.t/o.m);ctx.fillStyle='#5dff8a';ctx.fillText('+',o.x,o.y);}
 for(const o of FX.nu){ctx.globalAlpha=Math.min(1,o.t/.16);ctx.font='bold '+Math.min(11,11/ZOOM)+'px monospace';ctx.fillStyle='#000';ctx.fillText(o.s,o.x+1,o.y+1);ctx.fillStyle=o.c;ctx.fillText(o.s,o.x,o.y);}
 drawKillMarks();
 if(FX.exec&&FX.exec.t.alive){const t=FX.exec.t;ctx.globalAlpha=.8;ctx.strokeStyle='#ff2244';ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y,(t.r||11)+8,0,6.283);ctx.stroke();}
 ctx.globalAlpha=1;ctx.restore();}
{const _dr=drawRoofs;drawRoofs=function(){try{fxTop();}catch(e){console.error(e);}return _dr.apply(this,arguments);};}
if(typeof draftRoofs==='function'){const _dfr=draftRoofs;draftRoofs=function(){try{fxTop();}catch(e){}return _dfr.apply(this,arguments);};}
// ---- announcements removed from the battlefield in 4.5 ----
function fxScreen(rdt){}// 4.5: all announcements live in the control-panel strip; no gameplay overlays.
{const _rd2=render;render=function(){const now=performance.now(),rdt=Math.min(.1,(now-(FX.lastRT||now))/1000);FX.lastRT=now;
 FX.zm+=(FX.zmT-FX.zm)*Math.min(1,rdt*16);FX.zmT+=(1-FX.zmT)*Math.min(1,rdt*(FX.exec?1.5:5));const kd=Math.exp(-rdt*16);FX.kx*=kd;FX.ky*=kd;FX.vig=Math.max(0,FX.vig-rdt*1.4);
 FX.kx=Math.max(-5,Math.min(5,FX.kx));FX.ky=Math.max(-5,Math.min(5,FX.ky));FX.zmT=Math.min(1.05,FX.zmT);shake=Math.min(shake,9);const kx=FX.kx,ky=FX.ky;cam.x+=kx;cam.y+=ky;let r;try{r=_rd2.apply(this,arguments);}finally{cam.x-=kx;cam.y-=ky;}try{fxScreen(rdt);}catch(e){console.error(e);}return r;};}


// ===== 4.5: fixed anchor / panel feedback / timer safety =====
function joyBase(){const r=STICK_R;return{x:Math.max(r+12,Math.min(PW-r-16-SAFE.r,PW*.76)),y:Math.max(174,Math.min(PH-r-26-SAFE.b,PH*.68))};}
function joyDrag(s,x,y){const b=joyBase(),dx=x-s.sx,dy=y-s.sy,l=Math.hypot(dx,dy),k=l>STICK_R?STICK_R/l:1;s.ox=b.x;s.oy=b.y;s.x=b.x+dx*k;s.y=b.y+dy*k;}
function drawFixedJoy(c){const b=joyBase(),s=TCH.move;if(s)joyDrag(s,s.rawx,s.rawy);
 c.fillStyle='rgba(127,255,212,.035)';c.strokeStyle='rgba(127,255,212,.25)';c.lineWidth=2;c.beginPath();c.arc(b.x,b.y,STICK_R,0,Math.PI*2);c.fill();c.stroke();
 c.strokeStyle='rgba(255,255,255,.1)';c.beginPath();c.moveTo(b.x-9,b.y);c.lineTo(b.x+9,b.y);c.moveTo(b.x,b.y-9);c.lineTo(b.x,b.y+9);c.stroke();
 c.fillStyle=s?'rgba(127,255,212,.68)':'rgba(127,255,212,.23)';c.beginPath();c.arc(s?s.x:b.x,s?s.y:b.y,25,0,Math.PI*2);c.fill();
 pTxt(s?'MOVE':'RELEASE TO FIRE',b.x,b.y+STICK_R+18,10,'#7e9a92','center');}
function drawFeedback(){const now=performance.now(),c=pctx,y=72,hh=38;
 c.save();c.beginPath();c.rect(8,y,PW-16,hh);c.clip();c.fillStyle='#191c23';c.fillRect(8,y,PW-16,hh);
 let active=null;for(const o of FX.po)if(now-o.at<o.m*1000)active=o;
 const chain=now-FX.streakT<1600?FX.streak:0;
 const s=active?active.s:(FX.heal||'READY');const col=active?active.c:(FX.heal?'#7dff9a':'#788983');
 c.font='bold 14px monospace';const room=PW-(chain>1?100:28);let str=s;while(c.measureText(str).width>room&&str.length>1)str=str.slice(0,-1);
 const age=active?now-active.at:1000, lift=active?Math.max(0,3*(1-age/130)):0;pTxt(str,18,y+24-lift,14,col);
 if(chain>1){pTxt('×'+chain,PW-20,y+25-Math.max(0,3*(1-(now-FX.streakT)/160)),16,'#ffd37f','right');}
 c.restore();
 // Preserve just one badge; expired pooled records are reusable, not a growing queue.
 for(const o of FX.po)o.t=Math.max(0,o.m-(now-o.at)/1000);fxCompact(FX.po);
}
function drawKillMarks(){const now=performance.now();ctx.save();ctx.strokeStyle='#fff0c0';ctx.lineWidth=1.8/ZOOM;
 let j=0;for(const m of FX.marks){if(now>=m.until)continue;FX.marks[j++]=m;const q=(m.until-now)/180,r=4+6*(1-q);ctx.globalAlpha=q;ctx.beginPath();
 for(let i=0;i<4;i++){const a=Math.PI*.25+i*Math.PI*.5;ctx.moveTo(m.x+Math.cos(a)*r,m.y+Math.sin(a)*r);ctx.lineTo(m.x+Math.cos(a)*(r+4),m.y+Math.sin(a)*(r+4));}ctx.stroke();}FX.marks.length=j;ctx.restore();}
// Stunned execution victims (including civilian AI) cannot wander out of the short finisher.
{const _mv=move;move=function(u,dx,dy){if(FX.exec&&u===FX.exec.t)return;return _mv.apply(this,arguments);};}
// Burn/DoT bypasses hurt in the original game. Respect execution invulnerability on this path too.
{const _dot=dot;dot=function(u,d,byP){if(u===player){if(FX.exec||FX.shield||performance.now()<FX.invT)return;FX.lastHit=FX.gt;}return _dot.apply(this,arguments);};}
// Backgrounding / cancelled touches must never produce ghost movement or a surprise finisher.
function clearThumb(){TCH.move=null;TCH.ptr.clear();OT.tap=null;OT.justRel=false;OT.firing=false;mouse.down=mouse.pressed=false;if(player){player.burstN=0;player.charge=0;}}
window.addEventListener('blur',clearThumb);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearThumb();if(G.state==='play')togglePause();}});
